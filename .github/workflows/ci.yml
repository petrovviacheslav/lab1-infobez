name: Security CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: API and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test

  sast:
    name: SAST ESLint Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: mkdir -p reports
      - run: npm run sast:report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-report
          path: reports/sast.json
          if-no-files-found: error

  sca:
    name: SCA OWASP Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Audit all npm dependencies
        run: |
          mkdir -p reports
          npm audit --audit-level=high --json > reports/npm-audit.json
      - name: OWASP Dependency Check
        if: ${{ !cancelled() }}
        run: sh scripts/dependency-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-report
          path: reports/
          if-no-files-found: error
